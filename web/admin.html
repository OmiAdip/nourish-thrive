<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Nourish&amp;Thrive · Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F5FAF7;--card:#fff;--ink:#1E2B25;--mut:#66766F;--line:#E2ECE6;--berry:#1F6B4C;--berry-deep:#0F3828;--leaf:#2B7F5A;--leaf-light:#E3F3EA;--peach:#E6F4EC;--red:#B4432F;--amber:#B7791F;color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,-apple-system,sans-serif;font-size:14.5px;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Quicksand','Figtree',sans-serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(245,250,247,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:rgba(245,250,247,.92)}
.top-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:'Quicksand','Figtree',sans-serif;font-weight:700;font-size:20px;color:var(--berry);margin-right:auto}
.brand small{font-family:'Figtree',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf);margin-left:8px}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%}
.tab{border:none;background:none;padding:8px 13px;border-radius:999px;font-weight:600;color:var(--mut);white-space:nowrap}
.tab[aria-current="true"]{background:var(--peach);color:var(--berry-deep)}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(20,56,42,.04),0 12px 30px -20px rgba(20,56,42,.25)}
.card h2{font-size:19px;margin-bottom:10px}
.mut{color:var(--mut)}
.small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
@media(min-width:860px){.grid.two{grid-template-columns:1fr 1fr}}
.btn{border:none;border-radius:999px;padding:10px 16px;font-weight:700;background:linear-gradient(140deg,#2F8A63,#154D37);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--leaf-light);color:var(--leaf)}
.btn.danger{background:#FBE9E5;color:var(--red)}
.btn.sm{padding:7px 12px;font-size:12.5px}
label.f{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}
input.i,select.i,textarea.i{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:16px}
textarea.i{min-height:110px;resize:vertical;line-height:1.45}
textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;min-height:260px}
input.i:focus,select.i:focus,textarea.i:focus{outline:none;border-color:var(--berry);box-shadow:0 0 0 4px rgba(31,107,76,.12)}
.fields{display:grid;gap:0 12px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.list{display:flex;flex-direction:column}
.member{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line);background:none;border-left:none;border-right:none;border-bottom:none;text-align:left;width:100%}
.member:first-child{border-top:none}
.member:hover{background:#F3F8F5}
.av{width:40px;height:40px;border-radius:999px;flex-shrink:0;display:grid;place-items:center;color:#fff;font-family:'Quicksand',sans-serif;font-weight:700;background:linear-gradient(140deg,#2F8A63,#154D37)}
.grow{flex:1;min-width:0}
.name{font-weight:700}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--leaf-light);color:var(--leaf);margin:2px 4px 2px 0;white-space:nowrap}
.chip.red{background:#FBE9E5;color:var(--red)}
.chip.amber{background:#FCF1DE;color:var(--amber)}
.chip.berry{background:var(--peach);color:var(--berry-deep)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:'Quicksand',sans-serif;font-size:21px}
.stat span{font-size:11.5px;color:var(--mut)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 8px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);border-top:none}
.photos{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.photo{flex-shrink:0;text-align:center;font-size:11.5px;color:var(--mut)}
.photo img{width:120px;height:160px;object-fit:cover;border-radius:12px;display:block;background:var(--bg);margin-bottom:4px}
.note{background:var(--bg);border-radius:14px;padding:10px 12px;margin-bottom:8px;white-space:pre-wrap;line-height:1.45}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keybtn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:12.5px}
.keybtn[aria-pressed="true"]{border-color:var(--berry);background:var(--peach)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;z-index:50;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);max-width:90vw}
.center{max-width:400px;margin:8vh auto;padding:0 18px}
.back{border:none;background:none;color:var(--berry);font-weight:700;padding:6px 0;margin-bottom:8px}
.err{background:#FBE9E5;color:#9A3422;border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13.5px}
.empty{color:var(--mut);padding:10px 0}
svg.chart{width:100%;height:auto;max-height:220px;display:block}
[hidden]{display:none!important}
.row.end{justify-content:flex-end;margin-top:12px;gap:8px}
.mhead{padding-bottom:6px}
.mtabs{display:flex;gap:4px;overflow-x:auto;margin:14px -6px 0;padding:0 6px 8px;scrollbar-width:none}
.mtabs::-webkit-scrollbar{display:none}
.mtab{border:none;background:none;padding:8px 12px;border-radius:999px;font-weight:600;color:var(--mut);white-space:nowrap}
.mtab[aria-current="true"]{background:var(--leaf-light);color:var(--berry)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:0}
.kv>div{background:var(--bg);border-radius:12px;padding:9px 12px;min-width:0}
.kv dt{font-size:11.5px;color:var(--mut);margin-bottom:2px}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.why{font-family:'Quicksand',sans-serif;font-size:18px;font-weight:600;line-height:1.4;margin:0 0 6px;color:var(--berry)}
.calg{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;max-width:420px}
.cal{aspect-ratio:1;border-radius:6px;background:var(--line)}
.cal.on{background:var(--leaf)}
details.day{border-top:1px solid var(--line);padding:4px 0}
details.day:first-child{border-top:none}
details.day summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 2px;cursor:pointer;list-style:none}
details.day summary::-webkit-details-marker{display:none}
details.day summary::before{content:'›';color:var(--mut);font-weight:700;transition:transform .15s;display:inline-block;width:10px}
details.day[open] summary::before{transform:rotate(90deg)}
.pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--bg);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--leaf-light);color:var(--berry)}.pill.red{background:#FBE9E5;color:var(--red)}
table.plan td{min-width:130px}
.meal{font-size:12.5px;line-height:1.35}
.meal.eaten{color:var(--berry)}
.tick{font-weight:700;color:var(--leaf)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:70vh;overflow:auto;padding:4px}
.bub{max-width:82%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;line-height:1.45;font-size:14px}
.bub .who{font-size:11px;font-weight:700;margin-bottom:3px;opacity:.75}
.bub.me{align-self:flex-end;background:var(--berry);color:#fff;border-bottom-right-radius:6px}
.bub.ai{align-self:flex-start;background:var(--bg);border-bottom-left-radius:6px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(16,35,27,.45);display:flex;align-items:center;justify-content:center;padding:16px}
summary.adv{cursor:pointer;font-weight:700}

</style>
</head>
<body>
<div id="app"><div class="center mut">Loading…</div></div>
<script>
(function(){
'use strict';
var SB_URL='https://jzctsfvowmuowfxaiayy.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6Y3RzZnZvd211b3dmeGFpYXl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MDM2OTUsImV4cCI6MjEwODk3OTY5NX0.H62HF0V9dC1u6lkKiA4HEi1S0-2w9dYxSSr5v_Gmkrc';
var AUTH='ntadminauth';
var app=document.getElementById('app');
var session=null;try{session=JSON.parse(localStorage.getItem(AUTH)||'null')}catch(e){}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(sel,root){return (root||document).querySelector(sel)}
function $$(sel,root){return Array.prototype.slice.call((root||document).querySelectorAll(sel))}
function toast(t){$$('.toast').forEach(function(x){x.remove()});var d=document.createElement('div');d.setAttribute('role','status');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},2600)}
function parseVal(v){if(typeof v==='string'){try{return JSON.parse(v)}catch(e){return v}}return v}
function fmtDate(d){if(!d)return '–';var x=new Date(d);return isNaN(x)?String(d):x.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function ago(d){if(!d)return 'never';var m=Math.floor((Date.now()-new Date(d).getTime())/60000);if(m<2)return 'just now';if(m<60)return m+' min ago';var h=Math.floor(m/60);if(h<24)return h+' h ago';var dd=Math.floor(h/24);return dd===1?'yesterday':dd+' days ago'}
function daysSince(d){return d?Math.floor((Date.now()-new Date(d).getTime())/864e5):999}
function initials(n){return String(n||'M').trim().split(/\s+/).map(function(w){return w[0]}).join('').slice(0,2).toUpperCase()}
function num(v){var n=Number(v);return isFinite(n)?n:null}
function isoDay(off){var d=new Date();d.setDate(d.getDate()-off);return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}

/* ---------- Supabase ---------- */
function saveSession(s){
  if(s&&s.access_token){session={access_token:s.access_token,refresh_token:s.refresh_token,expires_at:s.expires_at||Math.floor(Date.now()/1000)+(s.expires_in||3600),user:s.user};localStorage.setItem(AUTH,JSON.stringify(session))}
  else{session=null;localStorage.removeItem(AUTH)}
}
async function auth(path,body,tok){
  var h={'Content-Type':'application/json',apikey:SB_KEY};if(tok)h.Authorization='Bearer '+tok;
  var r=await fetch(SB_URL+'/auth/v1/'+path,{method:'POST',headers:h,body:JSON.stringify(body||{})});
  var d={};try{d=await r.json()}catch(e){}
  if(!r.ok)throw new Error(d.msg||d.error_description||d.message||d.error||'Something went wrong');
  return d;
}
var refreshing=null;
async function token(){
  if(!session)throw new Error('Please log in');
  if(session.expires_at-90>Date.now()/1000)return session.access_token;
  if(!refreshing)refreshing=auth('token?grant_type=refresh_token',{refresh_token:session.refresh_token}).then(function(d){saveSession(d);return d.access_token}).finally(function(){refreshing=null});
  return refreshing;
}
async function rest(method,path,body,extra){
  var h={apikey:SB_KEY,Authorization:'Bearer '+(await token()),'Content-Type':'application/json'};
  for(var k in (extra||{}))h[k]=extra[k];
  var r=await fetch(SB_URL+'/rest/v1/'+path,{method:method,headers:h,body:body!==undefined?JSON.stringify(body):undefined});
  if(r.status===401){saveSession(null);render();throw new Error('Please log in again')}
  if(!r.ok){var t='';try{t=(await r.json()).message}catch(e){}throw new Error(t||('Request failed ('+r.status+')'))}
  if(r.status===204)return null;
  var txt=await r.text();return txt?JSON.parse(txt):null;
}
function enc(v){return encodeURIComponent(v)}
var db={
  userKeys:function(uid){return rest('GET','user_data?user_id=eq.'+uid+'&select=key,updated_at&order=key')},
  userGet:async function(uid,keys){
    var rows=await rest('GET','user_data?user_id=eq.'+uid+'&key=in.('+enc(keys.map(function(k){return '"'+k.replace(/"/g,'')+'"'}).join(','))+')&select=key,value,updated_at');
    var out={};(rows||[]).forEach(function(r){out[r.key]=parseVal(r.value)});return out;
  },
  userSet:function(uid,key,val){return rest('POST','user_data?on_conflict=user_id,key',[{user_id:uid,key:key,value:typeof val==='string'?val:JSON.stringify(val)}],{Prefer:'resolution=merge-duplicates,return=minimal'})},
  userDel:function(uid,key){return rest('DELETE','user_data?user_id=eq.'+uid+'&key=eq.'+enc(key))},
  docs:function(col){return rest('GET','shared_docs?collection=eq.'+enc(col)+'&select=doc_id,data,updated_at&order=updated_at.desc&limit=1000')},
  doc:async function(col,id){var r=await rest('GET','shared_docs?collection=eq.'+enc(col)+'&doc_id=eq.'+enc(id)+'&select=data');return r&&r[0]?r[0].data:null},
  docSet:function(col,id,data){return rest('POST','shared_docs?on_conflict=collection,doc_id',[{collection:col,doc_id:id,data:data}],{Prefer:'resolution=merge-duplicates,return=minimal'})},
  docDel:function(col,id){return rest('DELETE','shared_docs?collection=eq.'+enc(col)+'&doc_id=eq.'+enc(id))}
};

/* ---------- state & routing ---------- */
var state={tab:'members',users:null,filter:'',member:null};
function go(tab,member){state.tab=tab;state.member=member||null;location.hash=member?'member-'+member:tab;render()}
window.addEventListener('hashchange',function(){
  var h=location.hash.slice(1);
  if(h.indexOf('member-')===0){if(state.member!==h.slice(7)){state.tab='members';state.member=h.slice(7);render()}}
  else if(['members','squad','recipes','calls'].indexOf(h)>=0&&(h!==state.tab||state.member)){state.tab=h;state.member=null;render()}
});

/* ---------- login ---------- */
function loginView(note){
  app.innerHTML='<div class="center"><h1 style="font-size:32px;color:var(--berry);line-height:1.05">Nourish<br>&amp;Thrive</h1>'+
  '<p class="mut" style="margin:6px 0 20px">Coach panel. Log in with your coach account.</p>'+
  '<form id="lf" class="card" novalidate><label class="f" for="le">Email</label><input class="i" id="le" type="email" autocomplete="email" autocapitalize="none">'+
  '<label class="f" for="lp">Password</label><input class="i" id="lp" type="password" autocomplete="current-password">'+
  '<button class="btn" style="width:100%;margin-top:16px" id="lb">Log in</button><div id="lm"></div></form></div>';
  if(note)$('#lm').innerHTML='<div class="err">'+esc(note)+'</div>';
  $('#lf').onsubmit=async function(ev){
    ev.preventDefault();var b=$('#lb');b.disabled=true;b.textContent='Please wait…';$('#lm').innerHTML='';
    try{var s=await auth('token?grant_type=password',{email:$('#le').value.trim().toLowerCase(),password:$('#lp').value});saveSession(s);await start()}
    catch(e){$('#lm').innerHTML='<div class="err">'+esc(/invalid login/i.test(e.message)?'Wrong email or password.':e.message)+'</div>';b.disabled=false;b.textContent='Log in'}
  };
}
async function start(){
  try{
    var ok=await rest('POST','rpc/is_coach',{});
    if(ok!==true){var em=session.user&&session.user.email;saveSession(null);loginView((em||'This account')+' does not have coach access. Ask the app owner to make it a coach account.');return}
  }catch(e){saveSession(null);loginView(e.message);return}
  var h=location.hash.slice(1);
  if(h.indexOf('member-')===0){state.tab='members';state.member=h.slice(7)}
  else if(['members','squad','recipes','calls'].indexOf(h)>=0)state.tab=h;
  render();
}

/* ---------- shell ---------- */
function shell(inner){
  var tabs=[['members','Members'],['squad','Squad & challenge'],['recipes','Recipes'],['calls','Calls']];
  app.innerHTML='<header class="top"><div class="top-in"><div class="brand">Nourish&amp;Thrive<small>Coach</small></div>'+
    '<nav class="tabs">'+tabs.map(function(t){return '<button class="tab" data-tab="'+t[0]+'" aria-current="'+(state.tab===t[0])+'">'+t[1]+'</button>'}).join('')+'</nav>'+
    '<button class="btn ghost sm" id="mypw">My password</button><button class="btn ghost sm" id="logout">Log out</button></div></header><main class="wrap" id="main">'+inner+'</main>';
  $$('.tab').forEach(function(b){b.onclick=function(){go(b.dataset.tab)}});
  $('#mypw').onclick=myPasswordDialog;$('#logout').onclick=async function(){try{await auth('logout',{},session.access_token)}catch(e){}saveSession(null);loginView()};
}
function render(){
  if(!session){loginView();return}
  if(state.tab==='members'&&state.member)return memberView(state.member);
  if(state.tab==='members')return membersView();
  if(state.tab==='squad')return squadView();
  if(state.tab==='recipes')return recipesView();
  if(state.tab==='calls')return callsView();
}

/* ---------- members list ---------- */
function flags(u){
  var f=[],p=u.profile||{},d=daysSince(u.last_active);
  if(d>=3&&d<999)f.push(['Quiet '+d+' days','red']);
  if(d>=999)f.push(['Not started','amber']);
  if(u.unread_notes)f.push([u.unread_notes+' unread message'+(u.unread_notes>1?'s':''),'berry']);
  if(p.maintenance)f.push(['Maintenance','']);
  if(u.role==='coach')f.push(['Coach','berry']);
  return f;
}
async function membersView(){
  shell('<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Members</h2>'+
    '<input class="i" id="q" placeholder="Search name or email" style="max-width:280px" value="'+esc(state.filter)+'"></div>'+
    '<div id="ms" class="stats" style="margin:14px 0"></div><div id="ml" class="list"><div class="empty">Loading members…</div></div></div>');
  try{state.users=await rest('POST','rpc/admin_users',{})}catch(e){$('#ml').innerHTML='<div class="err">'+esc(e.message)+'</div>';return}
  var us=state.users||[];
  var active=us.filter(function(u){return daysSince(u.last_active)<3}).length;
  var quiet=us.filter(function(u){var d=daysSince(u.last_active);return d>=3&&d<999}).length;
  $('#ms').innerHTML=stat(us.length,'members')+stat(active,'active in last 3 days')+stat(quiet,'gone quiet');
  function draw(){
    var q=state.filter.toLowerCase();
    var list=us.filter(function(u){var n=((u.profile||{}).name||'')+' '+(u.email||'');return !q||n.toLowerCase().indexOf(q)>=0});
    $('#ml').innerHTML=list.length?list.map(function(u){
      var p=u.profile||{},c=u.latest_checkin||{};
      var w=num(c.weight)||num(p.weight),g=num(p.goal);
      return '<button class="member" data-id="'+u.id+'"><div class="av">'+esc(initials(p.name||u.email))+'</div><div class="grow"><div class="name ell">'+esc(p.name||'(no name yet)')+'</div>'+
        '<div class="small mut ell">'+esc(u.email||'')+' · active '+esc(ago(u.last_active))+(w?' · '+w+' kg'+(g?' → goal '+g+' kg':''):'')+'</div>'+
        '<div>'+flags(u).map(function(f){return '<span class="chip '+f[1]+'">'+esc(f[0])+'</span>'}).join('')+'</div></div><span class="mut">›</span></button>';
    }).join(''):'<div class="empty">No members found.</div>';
    $$('.member').forEach(function(b){b.onclick=function(){go('members',b.dataset.id)}});
  }
  $('#q').oninput=function(){state.filter=this.value;draw()};
  draw();
}
function stat(v,l){return '<div class="stat"><b>'+esc(v)+'</b><span>'+esc(l)+'</span></div>'}

/* ---------- one member ---------- */
var COUNTRY={in:'India',gb:'United Kingdom',uk:'United Kingdom',us:'United States',au:'Australia',ca:'Canada',nz:'New Zealand',ie:'Ireland',za:'South Africa',ae:'UAE',sg:'Singapore'};
var TIER={inner:'Inner circle',blueprint:'Blueprint'};
var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var SLOT={B:'Breakfast',L:'Lunch',D:'Dinner',S:'Snack'};
var MOOD=['','😞','😕','😐','🙂','😄'];
var WORDS={k:'Calories',kcal:'Calories',p:'Protein (g)',c:'Carbs (g)',f:'Fat (g)',n:'Name',name:'Name',s:'Meal',slot:'Meal',d:'Day',date:'Date',iso:'Date',secs:'Time',mins:'Minutes',win:'Win',struggle:'Struggle',mood:'Mood',energy:'Energy',sleep:'Sleep',cravings:'Cravings',weight:'Weight (kg)',note:'Note',text:'Text',feel:'Feeling',crave:'Craving',hour:'Hour',water:'Water (glasses)',steps:'Steps',reflection:'Reflection',nextFocus:'Next focus',week:'Week',fiber:'Fibre (g)',sugar:'Sugar (g)',salt:'Salt (g)',title:'Title',statement:'Statement',at:'When',target:'Target (h)',hours:'Hours',start:'Start',end:'End'};
var HIDE_COLS={id:1,e:1,hue:1,flags:1,pbs:1,sets:1,ing:1,steps:1,wid:1};
var SETTINGS_KEYS={'locale-confirmed':'Chose their country','reminders-added':'Added reminders to calendar','squad-visited':'Visited the Squad','session':'Logged in on phone','plan-shop-ticks':'Shopping list ticks','user-locale':'Country and shops','account':'App account','fav-recipes':'Favourite recipes','fav-workouts':'Favourite workouts','journey-claims':'Rewards claimed','journey-challenge':'Joined challenge','journey-history':'Challenge history','plan-eaten':'Meal plan ticks','food-library':'Saved foods'};

function words(k){if(WORDS[k])return WORDS[k];var t=String(k).replace(/[-_]/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2');return t.charAt(0).toUpperCase()+t.slice(1)}
function isDateStr(v){return typeof v==='string'&&/^\d{4}-\d{2}-\d{2}(T|$)/.test(v)}
function show(v,k){
  if(v===null||v===undefined||v==='')return '<span class="mut">–</span>';
  if(v===true)return 'Yes';if(v===false)return 'No';
  if(k==='mood'&&MOOD[v])return MOOD[v]+' '+v+'/5';
  if(k==='secs'&&typeof v==='number')return v>=60?Math.round(v/60)+' min':v+' s';
  if(isDateStr(v))return esc(fmtDate(v));
  if(typeof v==='number')return esc(v.toLocaleString('en-GB'));
  if(Array.isArray(v)){if(v.every(function(x){return typeof x!=='object'}))return esc(v.join(', '));return esc(v.length+' items')}
  if(typeof v==='object'){var ks=Object.keys(v);return esc(ks.slice(0,4).map(function(x){return words(x)+': '+(typeof v[x]==='object'?'…':v[x])}).join(' · '))}
  var s=String(v);return esc(s.length>160?s.slice(0,160)+'…':s);
}
/* Turns any saved data into readable tables, never raw code. */
function pretty(v){
  if(v===null||v===undefined||v==='')return '<div class="empty">Nothing saved yet.</div>';
  if(Array.isArray(v)){
    if(!v.length)return '<div class="empty">Nothing saved yet.</div>';
    if(v.every(function(x){return x&&typeof x==='object'&&!Array.isArray(x)})){
      var cols=[];v.forEach(function(r){Object.keys(r).forEach(function(c){if(!HIDE_COLS[c]&&cols.indexOf(c)<0)cols.push(c)})});
      cols=cols.slice(0,7);
      var rows=v.slice().reverse().slice(0,60);
      return '<div class="scroll"><table><thead><tr>'+cols.map(function(c){return '<th>'+esc(words(c))+'</th>'}).join('')+'</tr></thead><tbody>'+
        rows.map(function(r){return '<tr>'+cols.map(function(c){return '<td>'+show(r[c],c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'+(v.length>60?'<div class="small mut">Showing the latest 60 of '+v.length+'.</div>':'');
    }
    return '<p>'+esc(v.join(', '))+'</p>';
  }
  if(typeof v==='object'){
    var ks=Object.keys(v);
    if(!ks.length)return '<div class="empty">Nothing saved yet.</div>';
    if(ks.every(isDateStr)){
      ks.sort().reverse();
      return '<div class="scroll"><table><thead><tr><th>Date</th><th>Details</th></tr></thead><tbody>'+ks.slice(0,45).map(function(d){return '<tr><td>'+esc(fmtDate(d))+'</td><td>'+show(v[d])+'</td></tr>'}).join('')+'</tbody></table></div>';
    }
    return '<dl class="kv">'+ks.filter(function(k){return !HIDE_COLS[k]}).map(function(k){return '<div><dt>'+esc(words(k))+'</dt><dd>'+show(v[k],k)+'</dd></div>'}).join('')+'</dl>';
  }
  return '<p>'+show(v)+'</p>';
}
function section(title,sub,body,id){return '<div class="card"'+(id?' id="'+id+'"':'')+'><h2>'+esc(title)+'</h2>'+(sub?'<p class="mut small" style="margin:-4px 0 10px">'+esc(sub)+'</p>':'')+body+'</div>'}
function kvGrid(pairs){return '<dl class="kv">'+pairs.filter(function(p){return p[1]!==undefined&&p[1]!==null&&p[1]!==''}).map(function(p){return '<div><dt>'+esc(p[0])+'</dt><dd>'+p[1]+'</dd></div>'}).join('')+'</dl>'}

async function memberView(uid,tab){
  tab=tab||state.mtab||'overview';state.mtab=tab;
  shell('<button class="back" id="bk">‹ All members</button><div id="mv"><div class="card empty">Loading…</div></div>');
  $('#bk').onclick=function(){state.mtab='overview';go('members')};
  var user,rows,data={},meta={};
  try{
    if(!state.users)state.users=await rest('POST','rpc/admin_users',{});
    user=(state.users||[]).find(function(u){return u.id===uid});
    if(!user){$('#mv').innerHTML='<div class="card err">Member not found.</div>';return}
    rows=await rest('GET','user_data?user_id=eq.'+uid+'&key=neq.progress-photos&select=key,value,updated_at')||[];
    rows.forEach(function(r){data[r.key]=parseVal(r.value);meta[r.key]=r.updated_at});
    var ph=await rest('GET','user_data?user_id=eq.'+uid+'&key=eq.progress-photos&select=key,updated_at');
    if(ph&&ph.length)meta['progress-photos']=ph[0].updated_at;
  }catch(e){$('#mv').innerHTML='<div class="card err">'+esc(e.message)+'</div>';return}
  var M={uid:uid,user:user,data:data,meta:meta};
  var p=obj(data.profile);
  var head='<div class="card mhead"><div class="row"><div class="av" style="width:52px;height:52px;font-size:20px">'+esc(initials(p.name||user.email))+'</div><div class="grow">'+
    '<h1 style="font-size:24px">'+esc(p.name||'(no name yet)')+'</h1><div class="mut small">'+esc(user.email)+' · joined '+esc(fmtDate(user.joined))+' · active '+esc(ago(user.last_active))+'</div>'+
    '<div>'+flags(user).map(function(f){return '<span class="chip '+f[1]+'">'+esc(f[0])+'</span>'}).join('')+(p.tier?'<span class="chip">'+esc(TIER[p.tier]||p.tier)+'</span>':'')+'</div></div></div>'+
    '<nav class="mtabs" aria-label="Member sections">'+MTABS.map(function(t){return '<button class="mtab" data-mt="'+t[0]+'" aria-current="'+(t[0]===tab)+'">'+t[1]+'</button>'}).join('')+'</nav></div><div id="mbody"></div>';
  $('#mv').innerHTML=head;
  $$('.mtab').forEach(function(b){b.onclick=function(){state.mtab=b.dataset.mt;$$('.mtab').forEach(function(x){x.setAttribute('aria-current',String(x===b))});drawTab(M,b.dataset.mt)}});
  drawTab(M,tab);
}
function obj(v){return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}
function arr(v){return Array.isArray(v)?v:[]}
function drawTab(M,tab){
  var el=$('#mbody');
  var fn={overview:tabOverview,progress:tabProgress,food:tabFood,training:tabTraining,mind:tabMind,chat:tabChat,messages:tabMessages,account:tabAccount}[tab]||tabOverview;
  el.innerHTML='';fn(M,el);
}
function streakOf(act){var n=0,t=new Date();for(var i=act[isoDay(0)]?0:1;i<365;i++){if(act[isoDay(i)])n++;else break}return n}

  var html='<div class="card"><div class="stats">'+stat(latest?latest+' kg':'–','current weight')+stat(goal?goal+' kg':'–','goal weight')+
    stat(start&&latest?((start-latest)>=0?'−':'+')+Math.abs(start-latest).toFixed(1)+' kg':'–','change so far')+stat(streakOf(act)+' days','streak')+stat(Object.keys(act).length,'active days')+'</div></div>';
  html+='<div class="grid two"><div>';

    ['Age',p.age?esc(p.age):''],['Height',p.height?esc(p.height)+' cm':''],['Start weight',start?start+' kg':''],['Goal weight',goal?goal+' kg':''],
    ['Activity',esc(p.activity||'')],['Eating style',esc(p.style||'')],['Diet',esc(p.diet||tgt.diet||'')],['Cooking',esc({love:'Loves cooking',ok:'Happy to cook',hate:'Avoids cooking',quick:'Quick meals only'}[p.cookPref]||p.cookPref||'')],
    ['Country',esc(COUNTRY[p.country]||p.country||'')],['Shops',esc(arr(p.stores||tgt.stores).join(', '))],['Membership',esc(TIER[p.tier]||p.tier||'')],['Phone',esc(p.phone||'')],
    ['Shares check-ins with coach',p.shareWithCoach?'Yes':'No'],['Maintenance mode',p.maintenance?'Yes':'No'],['Invite code',esc(p.inviteCode||'')],['Event',esc(p.event||'')]
  ]));

  html+=section('Daily targets','Change these and the member gets them next time they open the app.','<div class="fields">'+fld('tc','Calories',tgt.calories)+fld('tp','Protein (g)',tgt.protein)+fld('tcb','Carbs (g)',tgt.carbs)+fld('tf','Fat (g)',tgt.fat)+'</div>'+

  html+=section('Goal and membership','','<div class="fields">'+fld('pg','Goal weight (kg)',p.goal)+'<div><label class="f" for="pt">Membership</label><select class="i" id="pt"><option value="blueprint"'+(p.tier!=='inner'?' selected':'')+'>Blueprint</option><option value="inner"'+(p.tier==='inner'?' selected':'')+'>Inner circle</option></select></div></div>'+
    '<label class="row small" style="margin-top:12px;gap:8px"><input type="checkbox" id="pm"'+(p.maintenance?' checked':'')+'> Maintenance mode (goal reached)</label><div class="row end"><button class="btn" id="ps">Save</button></div>');
  html+='</div></div>';
  el.innerHTML=html;
  $('#ts').onclick=async function(){
    var t=Object.assign({},tgt,{calories:num($('#tc').value),protein:num($('#tp').value),carbs:num($('#tcb').value),fat:num($('#tf').value),diet:$('#td').value.trim()||tgt.diet});
    this.disabled=true;try{await db.userSet(M.uid,'daily-target',t);M.data['daily-target']=t;toast('Targets saved')}catch(e){toast(e.message)}this.disabled=false;
  };

/* Food */
function tabFood(M,el){
  var d=M.data,tgt=obj(d['daily-target']);
  var days=Object.keys(d).filter(function(k){return /^food-log-\d{4}-\d{2}-\d{2}$/.test(k)}).sort().reverse();
  var diary=days.length?days.map(function(k,i){
    var items=arr(d[k]),kc=items.reduce(function(a,x){return a+(num(x.kcal)||0)},0),pr=items.reduce(function(a,x){return a+(num(x.p)||0)},0);
    var over=tgt.calories&&kc>tgt.calories*1.1,hit=tgt.calories&&kc>=tgt.calories*.85&&!over;
    return '<details class="day"'+(i===0?' open':'')+'><summary><span class="grow"><b>'+esc(fmtDate(k.slice(9)))+'</b> <span class="mut small">'+items.length+' item'+(items.length===1?'':'s')+'</span></span>'+
      '<span class="pill'+(over?' red':hit?' ok':'')+'">'+Math.round(kc)+(tgt.calories?' / '+tgt.calories:'')+' kcal</span><span class="pill">'+Math.round(pr)+(tgt.protein?' / '+tgt.protein:'')+' g protein</span></summary>'+
      '<div class="scroll"><table><thead><tr><th>Meal</th><th>Food</th><th>Calories</th><th>Protein</th><th>Carbs</th><th>Fat</th></tr></thead><tbody>'+
      items.map(function(x){return '<tr><td>'+esc(x.slot||'–')+'</td><td>'+esc(x.name||'')+'</td><td>'+show(x.kcal)+'</td><td>'+show(x.p)+' g</td><td>'+show(x.c)+' g</td><td>'+show(x.f)+' g</td></tr>'}).join('')+'</tbody></table></div></details>';
  }).join(''):'<div class="empty">No food logged yet.</div>';
  var html=section('Food diary','What they logged each day, against their targets.',diary);
  var plan=obj(d['meal-plan-week']),eaten=obj(d['plan-eaten']);
  if(arr(plan.days).length){
    var slots=['B','L','D','S'];
    html+=section('Meal plan','The plan the app made for them. ✓ means they marked it eaten.','<div class="scroll"><table class="plan"><thead><tr><th>Day</th>'+slots.map(function(s){return '<th>'+SLOT[s]+'</th>'}).join('')+'<th>Total</th></tr></thead><tbody>'+
      plan.days.map(function(day,di){var ms=arr(day.m),tot=ms.reduce(function(a,x){return a+(num(x.k)||0)},0);
        return '<tr><td><b>'+esc(day.d||DAYS[di%7])+'</b></td>'+slots.map(function(s){var mi=ms.findIndex(function(x){return x.s===s});var x=ms[mi];
          return '<td>'+(x?'<div class="meal'+(eaten[di+'-'+mi]?' eaten':'')+'">'+(eaten[di+'-'+mi]?'<span class="tick">✓</span> ':'')+esc((x.e||'')+' '+(x.n||''))+'<div class="small mut">'+show(x.k)+' kcal · '+show(x.p)+' g P</div></div>':'<span class="mut">–</span>')+'</td>'}).join('')+'<td>'+Math.round(tot)+' kcal</td></tr>'}).join('')+'</tbody></table></div>');
  }
  ['my-recipes','fav-recipes','food-library'].forEach(function(k){if(d[k]!==undefined)html+=section(SETTINGS_KEYS[k]||words(k),'',pretty(d[k]))});
  el.innerHTML=html;

  var shown=0;

/* Account */
function tabAccount(M,el){

  var html='<div class="grid two"><div>'+section('Login details','',kvGrid([['Email',esc(M.user.email)],['Account type',M.user.role==='coach'?'Coach':'Member'],['Joined',esc(fmtDate(M.user.joined))],['Last active',esc(ago(M.user.last_active))],
      ['Country',esc(COUNTRY[loc.country]||loc.country||'')],['Shops',esc(arr(loc.stores).join(', '))],['Currency',esc(loc.currency||'')]]));
  html+=section('Set a new password','Use this if they’re locked out. Tell them the new password yourself; they can change it later in the app under Preferences.',
    '<label class="f" for="np1">New password</label><input class="i" id="np1" type="password" autocomplete="new-password">'+
    '<label class="f" for="np2">Type it again</label><input class="i" id="np2" type="password" autocomplete="new-password">'+
    '<label class="row small" style="margin-top:8px;gap:8px"><input type="checkbox" id="npv"> Show password</label><div class="row end"><button class="btn" id="nps">Set password</button></div>');
  html+='</div><div>';
  html+=section('App settings','',settings.length?kvGrid(settings.map(function(k){var v=d[k];if(k==='plan-shop-ticks'){var t=obj(v),n=Object.keys(t).length,y=Object.keys(t).filter(function(x){return t[x]}).length;return [SETTINGS_KEYS[k],y+' of '+n+' items ticked']}return [SETTINGS_KEYS[k],typeof v==='object'?show(v):(String(v)==='1'||v===true||v==='in'?'Yes':esc(String(v)))]})):'<div class="empty">Nothing yet.</div>');
  html+='<div class="card"><details><summary class="adv">Advanced: edit saved data directly</summary><p class="mut small">For fixing problems only. Wrong changes can break that part of their app.</p>'+
    '<div class="keys">'+Object.keys(M.data).sort().map(function(k){return '<button class="keybtn" data-k="'+esc(k)+'" aria-pressed="false">'+esc(SETTINGS_KEYS[k]||words(k.replace(/^food-log-/,'Food ')))+'</button>'}).join('')+'</div>'+
    '<div id="raw" hidden style="margin-top:12px"><div class="row" style="justify-content:space-between"><b id="rk"></b><span class="mut small" id="ru"></span></div>'+
    '<textarea class="i code" id="rv" spellcheck="false"></textarea><div class="row" style="margin-top:8px;justify-content:space-between"><button class="btn danger sm" id="rd">Delete</button><button class="btn" id="rs">Save changes</button></div></div></details></div>';
  html+='</div></div>';
  el.innerHTML=html;
  $('#npv').onchange=function(){$('#np1').type=$('#np2').type=this.checked?'text':'password'};
  $('#nps').onclick=async function(){
    var a=$('#np1').value,b=$('#np2').value;
    if(a.length<6){toast('Password needs at least 6 characters');return}
    if(a!==b){toast('The two passwords don’t match');return}
    if(!confirm('Set a new password for '+M.user.email+'? Their old password will stop working.'))return;
    this.disabled=true;
    try{var r=await fetch(SB_URL+'/functions/v1/coach-account',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+(await token())},body:JSON.stringify({action:'set_password',user_id:M.uid,password:a})});
      var j={};try{j=await r.json()}catch(e){}
      if(!r.ok)throw new Error(j.error||'Could not change the password');
      $('#np1').value=$('#np2').value='';toast('Password changed for '+M.user.email);
    }catch(e){toast(e.message)}
    this.disabled=false;
  };
  var cur=null;
  $$('.keybtn').forEach(function(b){b.onclick=async function(){
    $$('.keybtn').forEach(function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true');
    cur=b.dataset.k;$('#raw').hidden=false;$('#rk').textContent=cur;$('#ru').textContent=M.meta[cur]?'changed '+ago(M.meta[cur]):'';
    var v=M.data[cur];$('#rv').value=typeof v==='string'?v:JSON.stringify(v,null,2);
  }});
  $('#rs').onclick=async function(){
    if(!cur)return;var txt=$('#rv').value,val,parsed;
    try{parsed=JSON.parse(txt);val=JSON.stringify(parsed)}catch(e){if(/^\s*[\[{]/.test(txt)){toast('That isn’t valid. Check brackets and commas.');return}val=txt;parsed=txt}
    this.disabled=true;try{await db.userSet(M.uid,cur,val);M.data[cur]=parsed;toast('Saved')}catch(e){toast(e.message)}this.disabled=false;
  };
  $('#rd').onclick=async function(){
    if(!cur||!confirm('Delete "'+cur+'" for this member? This can’t be undone.'))return;
    try{await db.userDel(M.uid,cur);delete M.data[cur];toast('Deleted');drawTab(M,'account')}catch(e){toast(e.message)}
  };
}

/* The coach's own password */
function myPasswordDialog(){
  var w=document.createElement('div');w.className='modal';w.setAttribute('role','dialog');w.setAttribute('aria-label','Change my password');
  w.innerHTML='<div class="card" style="max-width:420px;width:100%;margin:0"><h2>Change my password</h2><p class="mut small" style="margin:-4px 0 6px">'+esc(session.user.email)+'</p>'+
    '<label class="f" for="mp0">Current password</label><input class="i" id="mp0" type="password" autocomplete="current-password">'+
    '<label class="f" for="mp1">New password</label><input class="i" id="mp1" type="password" autocomplete="new-password">'+
    '<label class="f" for="mp2">Type it again</label><input class="i" id="mp2" type="password" autocomplete="new-password">'+
    '<div id="mpm"></div><div class="row end"><button class="btn ghost" id="mpc">Cancel</button><button class="btn" id="mps">Save new password</button></div></div>';
  document.body.appendChild(w);$('#mp0').focus();
  function close(){w.remove()}
  $('#mpc').onclick=close;w.onclick=function(e){if(e.target===w)close()};
  $('#mps').onclick=async function(){
    var c=$('#mp0').value,a=$('#mp1').value,b=$('#mp2').value,m=$('#mpm');
    function err(t){m.innerHTML='<div class="err">'+esc(t)+'</div>'}
    if(a.length<6)return err('New password needs at least 6 characters.');
    if(a!==b)return err('The two new passwords don’t match.');
    this.disabled=true;
    try{
      try{await auth('token?grant_type=password',{email:session.user.email,password:c})}catch(e){throw new Error('Your current password isn’t right.')}
      var r=await fetch(SB_URL+'/auth/v1/user',{method:'PUT',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+(await token())},body:JSON.stringify({password:a})});
      if(!r.ok){var j={};try{j=await r.json()}catch(e){}throw new Error(/same/i.test(String(j.msg||j.message))?'Your new password must be different from the old one.':(j.msg||j.message||'Couldn’t change your password.'))}
      close();toast('Password changed. Use it next time you log in, here and in the app.');
    }catch(e){err(e.message);this.disabled=false}
  };
}

function fld(id,l,v){return '<div><label class="f" for="'+id+'">'+esc(l)+'</label><input class="i" id="'+id+'" inputmode="decimal" value="'+esc(v==null?'':v)+'"></div>'}
function chart(checks){
  var pts=checks.map(function(c){return num(c.weight)}).filter(function(v){return v});
  if(pts.length<2)return '';
  var W=600,H=160,P=24,min=Math.min.apply(null,pts),max=Math.max.apply(null,pts);if(max-min<1){max+=.5;min-=.5}
  var xy=pts.map(function(v,i){return [P+i*(W-2*P)/(pts.length-1),P+(max-v)*(H-2*P)/(max-min)]});
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weight from '+pts[0]+' to '+pts[pts.length-1]+' kg">'+
    '<polyline fill="none" stroke="#1F6B4C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="'+xy.map(function(p){return p.join(',')}).join(' ')+'"/>'+
    xy.map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#fff" stroke="#1F6B4C" stroke-width="2"/>'}).join('')+
    '<text x="'+P+'" y="14" font-size="12" fill="#66766F">'+max.toFixed(1)+' kg</text><text x="'+P+'" y="'+(H-4)+'" font-size="12" fill="#66766F">'+min.toFixed(1)+' kg</text></svg>';
}

/* ---------- Squad & challenge ---------- */
var CH_DEFAULT={on:true,title:'8 Week Christmas Challenge',start:'2026-10-28',weeks:8,prize:'£300 cash for the top score',workoutsPerWeek:3,stepsGoal:8000,mindsetDays:4,bonus:{}};
async function squadView(){
  shell('<div class="card"><h2>Challenge</h2><div id="cf" class="empty">Loading…</div></div><div class="card"><h2>Squad members</h2><p class="mut small" style="margin:0 0 8px">Everyone who joined the Squad. Removing someone takes their entry off the leaderboard; they can rejoin from the app.</p><div id="sq" class="empty">Loading…</div></div>');
  try{
    var cfg=Object.assign({},CH_DEFAULT,await db.doc('config','challenge')||{});
    $('#cf').className='';
    $('#cf').innerHTML='<label class="row small" style="gap:8px"><input type="checkbox" id="con"'+(cfg.on?' checked':'')+'> Challenge is running</label>'+
      '<label class="f" for="ct">Title</label><input class="i" id="ct" value="'+esc(cfg.title)+'">'+
      '<div class="fields"><div><label class="f" for="cs">Start date</label><input class="i" id="cs" type="date" value="'+esc(cfg.start)+'"></div>'+fld('cw','Weeks',cfg.weeks)+fld('cwo','Workouts / week',cfg.workoutsPerWeek)+fld('cst','Steps goal / day',cfg.stepsGoal)+fld('cm','Mindset days / week',cfg.mindsetDays)+'</div>'+
      '<label class="f" for="cp">Prize</label><input class="i" id="cp" value="'+esc(cfg.prize)+'">'+
      '<div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn" id="csv">Save challenge</button></div>';
    $('#csv').onclick=async function(){
      var n=Object.assign({},cfg,{on:$('#con').checked,title:$('#ct').value.trim()||cfg.title,start:$('#cs').value||cfg.start,weeks:num($('#cw').value)||cfg.weeks,workoutsPerWeek:num($('#cwo').value)||0,stepsGoal:num($('#cst').value)||0,mindsetDays:num($('#cm').value)||0,prize:$('#cp').value.trim()});
      this.disabled=true;try{await db.docSet('config','challenge',n);cfg=n;toast('Challenge saved')}catch(e){toast(e.message)}this.disabled=false;
    };
  }catch(e){$('#cf').innerHTML='<div class="err">'+esc(e.message)+'</div>'}
  try{
    var rows=await db.docs('squad')||[];
    var wk=[];for(var i=0;i<7;i++)wk.push(isoDay(i));
    $('#sq').className='';
    $('#sq').innerHTML=rows.length?'<div class="scroll"><table><thead><tr><th>Name</th><th>Steps this week</th><th>Last update</th><th></th></tr></thead><tbody>'+rows.map(function(r){
      var d=r.data||{},steps=wk.reduce(function(a,day){return a+(num((d.steps||{})[day])||0)},0);
      return '<tr><td><b>'+esc(d.name||'Member')+'</b></td><td>'+steps.toLocaleString('en-GB')+'</td><td>'+esc(ago(d.updatedAt||r.updated_at))+'</td><td style="text-align:right"><button class="btn danger sm" data-rm="'+esc(r.doc_id)+'" data-n="'+esc(d.name||'Member')+'">Remove</button></td></tr>'}).join('')+'</tbody></table></div>':'<div class="empty">No one has joined the Squad yet.</div>';
    $$('[data-rm]').forEach(function(b){b.onclick=async function(){
      if(!confirm('Remove '+b.dataset.n+' from the Squad?'))return;
      try{await db.docDel('squad',b.dataset.rm);toast('Removed');squadView()}catch(e){toast(e.message)}
    }});
  }catch(e){$('#sq').innerHTML='<div class="err">'+esc(e.message)+'</div>'}
}

/* ---------- Recipes ---------- */
async function recipesView(){
  shell('<div class="card"><h2>Waiting for approval</h2><p class="mut small" style="margin:0 0 8px">Recipes members sent in. Approved recipes appear for everyone in the app.</p><div id="rp" class="empty">Loading…</div></div><div class="card"><h2>Community recipes</h2><div id="rc" class="empty">Loading…</div></div>');
  function rcard(x,actions){return '<div style="padding:10px 0;border-top:1px solid var(--line)"><div class="row" style="justify-content:space-between"><div class="grow"><b>'+esc((x.e||'')+' '+(x.n||'Recipe'))+'</b><div class="small mut">'+esc([x.meal,x.mins?x.mins+' min':'',x.k?x.k+' kcal':'',x.p?x.p+' g protein':''].filter(Boolean).join(' · '))+'</div></div><div class="row">'+actions+'</div></div>'+
    (Array.isArray(x.ing)&&x.ing.length?'<details class="small" style="margin-top:6px"><summary>Ingredients and steps</summary><p>'+x.ing.map(esc).join('<br>')+'</p>'+(Array.isArray(x.steps)?'<ol>'+x.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>':'')+'</details>':'')+'</div>'}
  try{
    var subs=await db.docs('submissions')||[],items=[];
    subs.forEach(function(r){((r.data||{}).items||[]).forEach(function(it){items.push({it:it,from:r.doc_id})})});
    $('#rp').className='';
    $('#rp').innerHTML=items.length?items.map(function(o,i){return rcard(o.it,'<button class="btn soft sm" data-ap="'+i+'">Approve</button><button class="btn danger sm" data-rj="'+i+'">Reject</button>')}).join(''):'<div class="empty">Nothing waiting.</div>';
    async function decide(i,approve){
      var o=items[i];
      try{
        if(approve)await db.docSet('community',String(o.it.id),Object.assign({},o.it,{approvedAt:new Date().toISOString()}));
        var cur=await db.doc('submissions',o.from)||{};
        await db.docSet('submissions',o.from,{items:(cur.items||[]).filter(function(x){return x.id!==o.it.id})});
        toast(approve?'Approved':'Rejected');recipesView();
      }catch(e){toast(e.message)}
    }
    $$('[data-ap]').forEach(function(b){b.onclick=function(){decide(+b.dataset.ap,true)}});
    $$('[data-rj]').forEach(function(b){b.onclick=function(){decide(+b.dataset.rj,false)}});
  }catch(e){$('#rp').innerHTML='<div class="err">'+esc(e.message)+'</div>'}
  try{
    var com=await db.docs('community')||[];
    $('#rc').className='';
    $('#rc').innerHTML=com.length?com.map(function(r){return rcard(r.data||{},'<button class="btn danger sm" data-del="'+esc(r.doc_id)+'">Remove</button>')}).join(''):'<div class="empty">No community recipes yet.</div>';
    $$('[data-del]').forEach(function(b){b.onclick=async function(){if(!confirm('Remove this recipe for everyone?'))return;try{await db.docDel('community',b.dataset.del);toast('Removed');recipesView()}catch(e){toast(e.message)}}});
  }catch(e){$('#rc').innerHTML='<div class="err">'+esc(e.message)+'</div>'}
}
